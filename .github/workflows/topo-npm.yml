name: Topocode renderer package

on:
  pull_request:
    paths: ["integrations/topo-npm/**", ".github/workflows/topo-npm.yml", ".github/workflows/publish-npm.yml"]
  push:
    branches: [main]
    paths: ["integrations/topo-npm/**", ".github/workflows/topo-npm.yml", ".github/workflows/publish-npm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test integrations/topo-npm/package.test.mjs
      - run: node integrations/topo-npm/pack.mjs dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topo-archify-${{ matrix.os }}
          path: dist/*.tgz
